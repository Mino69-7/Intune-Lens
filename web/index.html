<!doctype html>
<html lang="en" data-lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Intune Lens</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
  <!-- Language and theme: written into <html> by the server from the saved settings (no flash). -->
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/glass.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content" data-fr="Aller au contenu">Skip to content</a>

  <!-- Glass root: positioned; the background is a child; the glass panes are direct children. -->
  <div id="glass-root" class="root fx-light" data-view="home">

    <div class="layer-bg" aria-hidden="true"></div>

    <main id="content" class="layer-content" tabindex="-1">
      <div class="container">
        <p id="mock-banner" class="banner banner-demo" role="note" hidden>
          <span aria-hidden="true">●</span> <span data-fr="MODE DÉMO : données fictives">DEMO MODE: fictitious data</span>
        </p>
        <p id="stale-banner" class="banner banner-info" role="note" hidden></p>

        <!-- Screen 1: home -->
        <section id="home-view" class="home" aria-labelledby="home-title">
          <div class="hero">
            <h1 id="home-title">Intune Lens</h1>
            <p class="hero-sub" data-fr="Qui reçoit quoi dans Intune : par utilisateur, machine, groupe ou configuration.">Who gets what in Intune: by user, device, group or configuration.</p>
          </div>
          <div class="home-spacer" aria-hidden="true"></div>
          <div id="recent" class="recent" hidden>
            <div class="recent-head">
              <h2 data-fr="Recherches récentes">Recent searches</h2>
              <button type="button" class="btn-link" id="recent-clear" data-fr="Effacer">Clear</button>
            </div>
            <ul id="recent-list" class="chips"></ul>
          </div>
          <p class="hint muted">
            <kbd>/</kbd> <span data-fr="rechercher">search</span> · <kbd>U</kbd> <span data-fr="utilisateur">user</span> · <kbd>M</kbd> <span data-fr="machine">device</span> · <kbd>G</kbd> <span data-fr="groupe">group</span> · <kbd>C</kbd> configuration · <kbd>R</kbd> <span data-fr="synchroniser">sync</span> · <kbd>T</kbd> <span data-fr="thème">theme</span> · <kbd>Ctrl</kbd>+<kbd>V</kbd> <span data-fr="ouvrir un lien partagé">open a shared link</span>
          </p>
        </section>

        <!-- Screens 2 and 3: result -->
        <section id="result-view" class="result" hidden aria-live="polite" aria-busy="false">
          <div id="summary" class="summary" role="group" aria-label="Summary by family" data-fr-aria-label="Synthèse par famille"></div>
          <div id="notes"></div>
          <div class="toolbar" role="toolbar" aria-label="Filters and actions" data-fr-aria-label="Filtres et actions">
            <label class="field">
              <span class="visually-hidden" data-fr="Filtrer les résultats">Filter results</span>
              <input id="filter-text" type="search" placeholder="Filter results" data-fr-placeholder="Filtrer les résultats" autocomplete="off" spellcheck="false">
            </label>
            <label class="field" id="filter-mode-wrap">
              <span class="field-label" data-fr="Statut">Status</span>
              <select id="filter-mode">
                <option value="" data-fr="Tous">All</option>
                <option value="include" data-fr="Inclus">Included</option>
                <option value="exclude" data-fr="Exclus">Excluded</option>
              </select>
            </label>
            <label class="field" id="filter-device-wrap" hidden>
              <span class="field-label" data-fr="Appareil">Device</span>
              <select id="filter-device"></select>
            </label>
            <label class="field" id="filter-via-wrap">
              <span class="field-label">Via</span>
              <select id="filter-via">
                <option value="" data-fr="Tous">All</option>
                <option value="direct" data-fr="Groupe direct">Direct group</option>
                <option value="global" data-fr="Assignations globales">Global assignments</option>
              </select>
            </label>
            <span class="toolbar-spacer"></span>
            <button type="button" class="btn" id="btn-copy-table" data-fr="Copier le tableau">Copy table</button>
            <button type="button" class="btn" id="btn-export" data-fr="Exporter CSV">Export CSV</button>
          </div>
          <div id="table-host"></div>
          <nav id="pager" class="pager" aria-label="Pages" hidden></nav>
          <div id="empty" class="empty surface" hidden></div>
        </section>
      </div>
    </main>

    <!-- Scroll edge (macOS 26 style): fades the content passing under the top bar and the header. -->
    <div class="scroll-edge" aria-hidden="true"></div>

    <!-- Floating glass panes (direct children of the root) -->
    <div id="search-pill" class="glass g-search chrome" role="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span id="compare-chip" class="compare-chip" hidden data-fr="Comparer">Compare</span>
      <input id="search-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false"
             aria-controls="suggestions" aria-label="Search for a user" autocomplete="off" spellcheck="false"
             placeholder="Search for a user">
      <kbd class="kbd-hint" aria-hidden="true">/</kbd>
    </div>

    <!-- Type selector: icon + label (on the result screen, only the active tab keeps its label) -->
    <div id="segmented" class="glass g-segmented chrome" role="tablist" aria-label="Search type" data-fr-aria-label="Type de recherche">
      <button type="button" role="tab" id="tab-user" aria-selected="true" data-kind="user" aria-label="User" title="User (U)" data-fr-aria-label="Utilisateur" data-fr-title="Utilisateur (U)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.9-3.8 3.7-6 7-6s6.1 2.2 7 6"/></svg><span class="seg-label" data-fr="Utilisateur">User</span>
      </button>
      <button type="button" role="tab" id="tab-device" aria-selected="false" data-kind="device" tabindex="-1" aria-label="Device" title="Device (M)" data-fr-aria-label="Machine" data-fr-title="Machine (M)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v9H5z"/><path d="M3 18h18"/></svg><span class="seg-label" data-fr="Machine">Device</span>
      </button>
      <button type="button" role="tab" id="tab-group" aria-selected="false" data-kind="group" tabindex="-1" aria-label="Entra group" title="Entra group (G)" data-fr-aria-label="Groupe Entra" data-fr-title="Groupe Entra (G)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 19c.8-3.4 3.4-5 6.5-5s5.7 1.6 6.5 5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14c2 .6 3.2 2.3 3.5 5"/></svg><span class="seg-label" data-fr="Groupe Entra">Entra group</span>
      </button>
      <button type="button" role="tab" id="tab-object" aria-selected="false" data-kind="object" tabindex="-1" aria-label="Configuration" title="Configuration (C)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><span class="seg-label">Configuration</span>
      </button>
      <span class="seg-thumb" aria-hidden="true"></span>
    </div>

    <div id="suggestions" class="glass g-suggest" role="listbox" aria-label="Suggestions" hidden></div>

    <div id="status-pill" class="glass g-status chrome">
      <button type="button" id="status-btn" aria-haspopup="menu" aria-expanded="false">
        <span id="status-dot" class="dot" aria-hidden="true"></span>
        <span id="status-text" data-fr="Chargement…">Loading…</span>
      </button>
    </div>

    <div id="actions" class="glass g-actions chrome" role="group" aria-label="Actions">
      <button type="button" class="icon-btn" id="btn-refresh" title="Sync (R)" aria-label="Sync (R)" data-fr-title="Synchroniser (R)" data-fr-aria-label="Synchroniser (R)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-home" title="Home" aria-label="Back to home" data-fr-title="Accueil" data-fr-aria-label="Revenir à l'accueil">
        <!-- House -->
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings" data-fr-title="Réglages" data-fr-aria-label="Réglages" aria-haspopup="menu" aria-expanded="false">
        <!-- Gear (8 teeth) -->
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 2.6a1 1 0 0 1 1-.8h1.4a1 1 0 0 1 1 .8l.3 2a7.4 7.4 0 0 1 1.8.8l1.6-1.2a1 1 0 0 1 1.3.1l1 1a1 1 0 0 1 .1 1.3L17.6 8a7.4 7.4 0 0 1 .8 1.8l2 .3a1 1 0 0 1 .8 1v1.4a1 1 0 0 1-.8 1l-2 .3a7.4 7.4 0 0 1-.8 1.8l1.2 1.6a1 1 0 0 1-.1 1.3l-1 1a1 1 0 0 1-1.3.1L16 18.4a7.4 7.4 0 0 1-1.8.8l-.3 2a1 1 0 0 1-1 .8h-1.4a1 1 0 0 1-1-.8l-.3-2a7.4 7.4 0 0 1-1.8-.8l-1.6 1.2a1 1 0 0 1-1.3-.1l-1-1a1 1 0 0 1-.1-1.3L6.4 16a7.4 7.4 0 0 1-.8-1.8l-2-.3a1 1 0 0 1-.8-1v-1.4a1 1 0 0 1 .8-1l2-.3a7.4 7.4 0 0 1 .8-1.8L5.2 6.8a1 1 0 0 1 .1-1.3l1-1a1 1 0 0 1 1.3-.1L9.2 5.6a7.4 7.4 0 0 1 1.8-.8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <header id="result-header" class="glass g-header" hidden></header>

    <aside id="detail-panel" class="glass g-panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden>
      <div class="panel-head">
        <h2 id="panel-title" data-fr="Détail">Details</h2>
        <button type="button" class="icon-btn" id="panel-close" aria-label="Close details (Esc)" data-fr-aria-label="Fermer le détail (Échap)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="panel-body" class="panel-body"></div>
    </aside>

    <div id="menu" class="glass g-menu" role="menu" hidden></div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="overlay" class="overlay" role="alertdialog" aria-modal="true" aria-labelledby="overlay-title" aria-describedby="overlay-text" hidden>
      <div class="overlay-card">
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
        <button type="button" class="btn" id="overlay-retry" data-fr="Réessayer">Retry</button>
      </div>
    </div>
  </div>
</body>
</html>
